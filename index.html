<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>Futures Kontraktrechner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#19263a;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:550px;margin:auto;padding:15px 15px 10px}h1{font-size:22px;margin:0 0 3px}.sub{font-size:12px;color:#69778a;margin-bottom:12px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:600;color:#43536a;margin:0 0 5px}.field{margin-bottom:11px}select,input{width:100%;height:43px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#142238;padding:8px 11px;font-size:16px}select:focus,input:focus{outline:2px solid #8bbbf4}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #d8e1ed;background:#fff;border-radius:13px;padding:13px 11px;min-width:0}.card.optional{background:#f1f7ff;border-color:#bed8fb}.eyebrow{font-size:12px;font-weight:600;color:#56667c}.big{font-size:36px;line-height:1.15;font-weight:800;color:#13805b;margin:7px 0}.optional .big{color:#2563a8}.risk{font-size:20px;font-weight:750;white-space:nowrap}.note{font-size:12px;color:#637187;line-height:1.4;margin-top:8px}.over{font-size:12px;color:#ad4939;font-weight:650;line-height:1.45;margin-top:8px}.error{color:#b42318}footer{font-size:11px;color:#748197;line-height:1.4;margin-top:10px}button{border:0;background:#e7edf5;color:#31435a;padding:9px 12px;border-radius:9px;font-size:12px;margin-top:10px}
@media(max-width:350px){.risk{font-size:17px}.big{font-size:30px}.card{padding:10px 8px}}
@media(max-height:650px){main{padding-top:9px}.sub{margin-bottom:8px}.field{margin-bottom:8px}.card{padding:10px}.big{font-size:30px;margin:4px 0}footer{font-size:10px}}
</style></head><body><main><h1>Futures-Kontraktrechner</h1><div class="sub">MNQ · MYM · MES · MGC | Offline nutzbar</div>
<div class="field"><label for="future">Future auswählen</label><select id="future"><option value="MNQ">MNQ – Nasdaq</option><option value="MYM">MYM – Dow Jones</option><option value="MES">MES – S&amp;P 500</option><option value="MGC">MGC – Gold</option></select></div>
<div class="inputs"><div class="field"><label for="risk">Risiko (USD)</label><input id="risk" type="number" inputmode="decimal" min="0" step="any" value="500"></div><div class="field"><label for="stop" id="stopLabel">SL-Abstand (Punkte)</label><input id="stop" type="number" inputmode="decimal" min="0" step="any" value="23"></div></div>
<div class="results"><section class="card"><div class="eyebrow">Regulär</div><div class="big" id="contracts">–</div><div class="eyebrow">Kontrakte</div><div class="risk" id="actual">–</div><div class="note" id="details"></div></section><section class="card optional"><div class="eyebrow">Optional +1</div><div class="big" id="extraContracts">–</div><div class="eyebrow">Kontrakte</div><div class="risk" id="extraRisk">–</div><div class="over" id="overBudget"></div></section></div>
<button id="reset" type="button">Zurücksetzen</button><footer>Ohne Gebühren und Slippage. Optional +1 kann dein Risikobudget überschreiten.</footer>
</main><script>
const vals={MNQ:2,MYM:.5,MES:5,MGC:10};const $=id=>document.getElementById(id);const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){let k=$('future').value,a=Number($('risk').value),b=Number($('stop').value);$('stopLabel').textContent=k==='MGC'?'SL-Abstand (USD)':'SL-Abstand (Punkte)';if(!$('risk').value||!$('stop').value||!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0){for(const id of ['contracts','actual','extraContracts','extraRisk'])$(id).textContent='–';$('details').textContent='Positive Werte eingeben';$('overBudget').textContent='';return}
let per=b*vals[k],n=Math.floor(a/per),actual=n*per,extra=(n+1)*per,over=Math.max(0,extra-a);
$('contracts').textContent=n.toLocaleString('de-DE');$('actual').textContent=fmt(actual)+' $';$('extraContracts').textContent=(n+1).toLocaleString('de-DE');$('extraRisk').textContent=fmt(extra)+' $';$('details').textContent=n===0?'1 Kontrakt über Budget':'Restbudget: '+fmt(a-actual)+' $';$('overBudget').textContent='Über Budget: +'+fmt(over)+' $ ('+fmt(over/a*100)+' %)'}
for(const id of ['future','risk','stop'])$(id).addEventListener('input',calc);$('reset').addEventListener('click',()=>{$('future').value='MNQ';$('risk').value='500';$('stop').value='23';calc()});calc();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>reg.update()).catch(()=>{}));
</script></body></html>
