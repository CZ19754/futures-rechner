<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>Futures Kontraktrechner</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:system-ui,Arial,sans-serif}main{max-width:480px;margin:auto;padding:22px 17px}h1{font-size:24px;margin:10px 0 5px}.sub{color:#aab8cd;font-size:14px;margin-bottom:25px}label{display:block;font-size:14px;color:#c3d0e1;margin:19px 0 8px}select,input{width:100%;border:1px solid #34455d;border-radius:13px;background:#18253a;color:white;padding:15px;font-size:19px;outline:none}input:focus,select:focus{border-color:#5bbdff}.card{background:#162338;border:1px solid #2b3d55;border-radius:18px;padding:20px;margin-top:24px}.eyebrow{font-size:13px;color:#b2c3da}.big{font-size:42px;font-weight:750;margin:4px 0 15px;color:#6ae9a4}.risk{font-size:28px;font-weight:700;margin:5px 0}.note{font-size:13px;color:#b0bdd0;line-height:1.55;margin-top:18px}.error{color:#ff9b9b}button{background:#304c70;color:white;border:0;border-radius:12px;padding:12px 15px;margin-top:18px;font-size:15px}footer{color:#8595ab;font-size:12px;margin-top:22px}</style></head><body><main><h1>Futures Kontraktrechner</h1><div class="sub">MNQ · MYM · MES · MGC | Offline nutzbar</div>
<label for="future">Future</label><select id="future"><option value="MNQ">MNQ – Micro Nasdaq</option><option value="MYM">MYM – Micro Dow Jones</option><option value="MES">MES – Micro S&amp;P 500</option><option value="MGC">MGC – Micro Gold</option></select>
<label for="risk">Risiko in USD</label><input id="risk" type="number" inputmode="decimal" min="0" step="any" value="500">
<label for="stop" id="stopLabel">Stop-Loss-Abstand in Indexpunkten</label><input id="stop" type="number" inputmode="decimal" min="0" step="any" value="100">
<div class="card"><div class="eyebrow">Maximal mögliche ganze Kontrakte</div><div class="big" id="contracts">2</div><div class="eyebrow">Rechnerisches Risiko</div><div class="risk" id="actual">400,00 $</div><div class="note" id="details"></div></div><div class="card"><div class="eyebrow">Optional: +1 Kontrakt</div><div class="big" id="extraContracts">–</div><div class="eyebrow">Risiko mit zusätzlichem Kontrakt</div><div class="risk" id="extraRisk">–</div><div class="note" id="overBudget"></div></div>
<button id="reset">Zurücksetzen</button><footer>Ohne Kommissionen und Slippage. Ein Stop garantiert keinen exakten Ausführungspreis. Keine Anlageberatung.</footer></main><script>
const vals={MNQ:2,MYM:.5,MES:5,MGC:10},f=document.getElementById('future'),r=document.getElementById('risk'),s=document.getElementById('stop'),out=document.getElementById('contracts'),actual=document.getElementById('actual'),details=document.getElementById('details'),sl=document.getElementById('stopLabel');const fmt=x=>x.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});function calc(){let k=f.value,a=Number(r.value.replace(',','.')),b=Number(s.value.replace(',','.'));sl.textContent=k==='MGC'?'Stop-Loss-Abstand in USD Goldpreis':'Stop-Loss-Abstand in Indexpunkten';if(!r.value||!s.value||!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0){out.textContent='–';actual.textContent='–';details.textContent='Bitte positive Werte eingeben.';details.className='note error';document.getElementById('extraContracts').textContent='–';document.getElementById('extraRisk').textContent='–';document.getElementById('overBudget').textContent='';return}let n=Math.floor(a/(b*vals[k])),used=n*b*vals[k];out.textContent=n.toLocaleString('de-DE');actual.textContent=fmt(used)+' $';let additional=(n+1)*b*vals[k],over=Math.max(0,additional-a);document.getElementById('extraContracts').textContent=(n+1).toLocaleString('de-DE');document.getElementById('extraRisk').textContent=fmt(additional)+' $';document.getElementById('overBudget').textContent='Zusätzliches Risiko: '+fmt(b*vals[k])+' $. Überschreitung des Budgets: +'+fmt(over)+' $ ('+fmt(over/a*100)+' %).';details.className='note';details.textContent='1 Kontrakt: '+fmt(vals[k])+' $ je '+(k==='MGC'?'1 USD Goldpreisbewegung':'Indexpunkt')+'. '+(n===0?'Bereits ein Kontrakt würde dein Risikobudget überschreiten.':'Restbudget: '+fmt(a-used)+' $.')};[f,r,s].forEach(x=>x.addEventListener('input',calc));document.getElementById('reset').addEventListener('click',()=>{f.value='MNQ';r.value='500';s.value='100';calc()});calc();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
